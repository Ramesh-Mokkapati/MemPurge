name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.configuration }} ${{ matrix.platform }}
    # Visual Studio 2022 with the C++ ATL/MFC component (needed for MFC) and the v143 toolset.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [ Debug, Release ]
        platform: [ x64, x86 ]
        include:
          # The solution platform x86 builds the projects' Win32 platform, which is the
          # folder name under bin\.
          - platform: x64
            outdir: x64
          - platform: x86
            outdir: Win32

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,18.0)'

      # -warnaserror turns every compiler (/W4), linker, resource-compiler and MSBuild
      # warning into an error, so a green run means zero warnings.
      - name: Build
        run: >
          msbuild MemPurge.sln
          /t:Rebuild
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=${{ matrix.platform }}
          /m /nologo /v:minimal
          -warnaserror

      # The tests link only pure helpers and never perform a memory operation, so they are
      # safe to run unelevated on the runner. MemPurge.exe itself is never launched.
      - name: Test
        run: bin\${{ matrix.outdir }}\${{ matrix.configuration }}\MemPurgeTests.exe

      - name: Upload MemPurge.exe
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: MemPurge-${{ matrix.platform }}
          path: bin/${{ matrix.outdir }}/Release/MemPurge.exe
          if-no-files-found: error

  release:
    name: Release
    # Every push to main whose builds and tests all pass gets its own tag and GitHub release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Bump the major/minor here; the patch number is the workflow run number.
      VERSION: v1.0.${{ github.run_number }}

    steps:
      - name: Download MemPurge.exe
        uses: actions/download-artifact@v8
        with:
          pattern: MemPurge-*
          path: artifacts

      # MemPurge-<tag>-<platform>.zip with MemPurge.exe at the root: the name and layout the
      # Deployments installer (ComponentSuite.msi) fetches.
      - name: Zip assets
        run: |
          mkdir release
          for platform in x64 x86; do
            zip -j "release/MemPurge-$VERSION-$platform.zip" "artifacts/MemPurge-$platform/MemPurge.exe"
          done

      # gh creates the tag on the pushed commit and generates notes from the commits since the
      # previous release.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$VERSION" release/*.zip
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "MemPurge $VERSION"
          --generate-notes
          --latest
